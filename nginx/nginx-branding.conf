# Orcastra Authentik reverse-proxy + branding drop-in.
#
# Production shape: nginx:1.27-alpine in front of authentik server:9000.
# Public origin example: https://sso.orcastra.io (Cloudflare -> host :9000).
#
# Placeholders filled by scripts/apply-orcastra-theme.sh (default version 73):
#   THEME_VERSION token        cache-bust query on orcastra-theme.js
#   INJECT_THEME_CACHEBUST     sub_filter rules rewriting old ?v=70..(N-1)
#
# Manual install without the script:
#   1. Replace the THEME_VERSION token with 73 (or your version).
#   2. Replace the INJECT_THEME_CACHEBUST line with sub_filter rules
#      for leftover ?v=70 ?v=71 ?v=72 -> current, or delete that line.
#
# Requires ngx_http_sub_module (enabled in the official nginx alpine image).
# Accept-Encoding is cleared on / so sub_filter can see uncompressed HTML.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 0;
    absolute_redirect off;

    # Theme JS must not be cached: operators bump THEME_VERSION to force reload.
    location = /branding/orcastra-theme.js {
        alias /usr/share/nginx/html/branding/orcastra-theme.js;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }

    location /branding/ {
        alias /usr/share/nginx/html/branding/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location /ws/ {
        proxy_pass http://server:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://server:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        __INJECT_THEME_CACHEBUST__
        sub_filter '</head>' '<script src="/branding/orcastra-theme.js?v=__THEME_VERSION__" defer></script></head>';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
