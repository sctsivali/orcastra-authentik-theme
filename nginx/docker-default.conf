# Laptop / docker-compose bind-mount of nginx-branding.conf.
# Tokens already filled: THEME_VERSION=73. No __INJECT_THEME_CACHEBUST__.
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.yml.
#
# Production still uses nginx/nginx-branding.conf (placeholders) +
# scripts/apply-orcastra-theme.sh — do not replace that file with this one.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 0;
    absolute_redirect off;

    # Theme JS must not be cached: operators bump THEME_VERSION to force reload.
    location = /branding/orcastra-theme.js {
        alias /usr/share/nginx/html/branding/orcastra-theme.js;
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }

    location /branding/ {
        alias /usr/share/nginx/html/branding/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
    }

    location /ws/ {
        proxy_pass http://server:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://server:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        sub_filter '</head>' '<script src="/branding/orcastra-theme.js?v=73" defer></script></head>';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
